server {
    listen 80;
    server_name syncme.biztras.com;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /rejlershrms {
        return 301 /rejlershrms/;
    }

    location = /rejlershrms/index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /rejlershrms/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /rejlershrms/ {
        try_files $uri $uri/ /rejlershrms/index.html;
    }

    location / {
        return 404;
    }
}
